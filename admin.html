<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Mohsen Nasri</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#06101a;
    color:#fff;
}

button,input,textarea,select{
    font-family:inherit;
}

header{
    background:#020911;
    border-bottom:1px solid #263746;
    padding:18px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

header h1{
    margin:0;
    font-size:21px;
}

header span{
    color:#38bdf8;
}

.container{
    width:min(1200px,94%);
    margin:30px auto;
}

.card{
    background:#0b1824;
    border:1px solid #263746;
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
}

h2{
    margin-top:0;
    color:#38bdf8;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#b8c6cd;
}

input,textarea,select{
    width:100%;
    background:#071017;
    border:1px solid #344858;
    color:#fff;
    padding:13px;
    border-radius:8px;
    outline:none;
}

input:focus,textarea:focus,select:focus{
    border-color:#38bdf8;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 22px;
    cursor:pointer;
    margin:8px 4px;
    font-weight:bold;
}

.primary{
    background:#0ea5e9;
    color:#fff;
}

.success{
    background:#16a34a;
    color:#fff;
}

.danger{
    background:#dc2626;
    color:#fff;
}

.secondary{
    background:#334155;
    color:#fff;
}

.hidden{
    display:none!important;
}

.status{
    padding:12px;
    border-radius:8px;
    margin:15px 0;
    background:#111f2c;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.content-item{
    background:#071017;
    border:1px solid #263746;
    border-radius:12px;
    padding:18px;
}

.content-item h3{
    color:#38bdf8;
    margin-top:0;
}

.content-item p{
    color:#c7d2da;
    white-space:pre-wrap;
}

.media-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.media-card{
    background:#071017;
    border:1px solid #263746;
    border-radius:12px;
    padding:10px;
}

.media-card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:8px;
    display:block;
    background:#020911;
}

.media-info{
    padding:10px 4px;
    color:#8ea2b2;
    font-size:12px;
    word-break:break-all;
}

.file-info{
    margin-top:10px;
    padding:10px;
    background:#071017;
    border-radius:8px;
    color:#8ea2b2;
    font-size:13px;
}

.preview{
    max-width:350px;
    max-height:220px;
    display:none;
    margin-top:15px;
    border-radius:10px;
    border:2px solid #38bdf8;
}

.logout{
    background:#dc2626;
    color:#fff;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }

    .media-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:500px){
    .media-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://eurmybgotfgnerdxrwua.supabase.co";

const SUPABASE_KEY =
"sb_publishable_X3LYjYSbJU7YJ0ezzn6YfA_ZHsbd1K3";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");

    if(!email || !password){

        status.textContent =
        "ایمیل و رمز عبور را وارد کنید.";

        return;
    }

    status.textContent =
    "در حال ورود...";

    const {data,error} =
    await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
    });

    if(error){

        status.textContent =
        "خطا در ورود: " +
        error.message;

        return;
    }

    showAdmin();

}


/* =====================================================
   SESSION
===================================================== */

async function checkSession(){

    const {data,error} =
    await supabaseClient.auth.getSession();

    if(error){

        console.error(error);

        return;
    }

    if(data.session){

        showAdmin();

    }

}


function showAdmin(){

    document
    .getElementById("loginBox")
    .classList.add("hidden");

    document
    .getElementById("adminPanel")
    .classList.remove("hidden");

    document
    .getElementById("logoutBtn")
    .classList.remove("hidden");

    loadIndustry();

}


document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        location.reload();

    }
);


/* =====================================================
   CURRENT INDUSTRY
===================================================== */

function currentIndustry(){

    return document
    .getElementById("industrySelect")
    .value;

}


/* =====================================================
   LOAD INDUSTRY
===================================================== */

async function loadIndustry(){

    const status =
        document.getElementById("mainStatus");

    status.textContent =
        "در حال دریافت اطلاعات صنعت...";

    clearForm();

    await loadContent();

    await loadGallery();

    await loadVideos();

    status.textContent =
        "صنعت انتخاب‌شده: " +
        currentIndustry();

}


/* =====================================================
   SAVE CONTENT
===================================================== */

async function saveContent(){

    const id =
        document.getElementById("editId").value;

    const industry =
        currentIndustry();

    const contentType =
        document.getElementById("contentType").value;

    const title =
        document.getElementById("contentTitle")
        .value
        .trim();

    const subtitle =
        document.getElementById("contentSubtitle")
        .value
        .trim();

    const content =
        document.getElementById("contentText")
        .value
        .trim();

    const sortOrder =
        Number(
            document.getElementById("sortOrder").value
        ) || 0;


    if(!title && !content){

        alert(
            "عنوان یا متن را وارد کنید."
        );

        return;
    }


    const payload = {

        industry:industry,

        content_type:contentType,

        title:title,

        subtitle:subtitle,

        content:content,

        sort_order:sortOrder,

        is_visible:true,

        updated_at:new Date().toISOString()

    };


    let result;


    if(id){

        result =
        await supabaseClient
        .from("industry_content")
        .update(payload)
        .eq("id",id);

    }else{

        result =
        await supabaseClient
        .from("industry_content")
        .insert(payload);

    }


    if(result.error){

        alert(
            "خطا در ذخیره:\n" +
            result.error.message
        );

        return;
    }


    alert(
        "محتوا با موفقیت ذخیره شد."
    );

    clearForm();

    await loadContent();

}


/* =====================================================
   LOAD CONTENT
===================================================== */

async function loadContent(){

    const industry =
        currentIndustry();

    const list =
        document.getElementById("contentList");

    list.innerHTML =
        "در حال دریافت محتوا...";


    const {data,error} =
        await supabaseClient
        .from("industry_content")
        .select("*")
        .eq("industry",industry)
        .order(
            "sort_order",
            {
                ascending:true
            }
        )
        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        list.innerHTML =
            "خطا: " +
            escapeHtml(error.message);

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML =
            "<p>هنوز محتوایی ثبت نشده است.</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach(function(item){

        const div =
            document.createElement("div");

        div.className =
            "content-item";


        div.innerHTML = `

            <div class="small">
                ${escapeHtml(item.content_type || "")}
            </div>

            <h3>
                ${escapeHtml(item.title || "")}
            </h3>

            <p>
                ${escapeHtml(item.content || "")}
            </p>

            <button
                class="primary"
                onclick="editContent(${item.id})"
            >
                ویرایش
            </button>

            <button
                class="danger"
                onclick="deleteContent(${item.id})"
            >
                حذف
            </button>

        `;


        list.appendChild(div);

    });

}


/* =====================================================
   EDIT CONTENT
===================================================== */

async function editContent(id){

    const {data,error} =
        await supabaseClient
        .from("industry_content")
        .select("*")
        .eq("id",id)
        .single();


    if(error){

        alert(error.message);

        return;
    }


    document.getElementById("editId").value =
        data.id;

    document.getElementById("contentType").value =
        data.content_type || "section";

    document.getElementById("contentTitle").value =
        data.title || "";

    document.getElementById("contentSubtitle").value =
        data.subtitle || "";

    document.getElementById("contentText").value =
        data.content || "";

    document.getElementById("sortOrder").value =
        data.sort_order || 0;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   DELETE CONTENT
===================================================== */

async function deleteContent(id){

    if(!confirm(
        "این محتوا حذف شود؟"
    )){

        return;
    }


    const {error} =
        await supabaseClient
        .from("industry_content")
        .delete()
        .eq("id",id);


    if(error){

        alert(error.message);

        return;
    }


    await loadContent();

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

    document.getElementById("editId").value =
        "";

    document.getElementById("contentTitle").value =
        "";

    document.getElementById("contentSubtitle").value =
        "";

    document.getElementById("contentText").value =
        "";

    document.getElementById("sortOrder").value =
        0;

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(){

    const file =
        document
        .getElementById("imageFile")
        .files[0];

    const preview =
        document
        .getElementById("imagePreview");

    const info =
        document
        .getElementById("fileInfo");


    if(!file){

        preview.style.display =
            "none";

        info.textContent =
            "هنوز تصویری انتخاب نشده است.";

        return;
    }


    info.textContent =
        "نام فایل: " +
        file.name +
        " | حجم: " +
        formatBytes(file.size);


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            preview.src =
                event.target.result;

            preview.style.display =
                "block";

        };


    reader.readAsDataURL(file);

}


function formatBytes(bytes){

    if(bytes === 0){

        return "0 Bytes";

    }


    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        bytes /
        Math.pow(1024,i)
    ).toFixed(2)
    + " "
    + units[i];

}


/* =====================================================
   UPLOAD IMAGE
===================================================== */

async function uploadImage(){

    const file =
        document
        .getElementById("imageFile")
        .files[0];

    const status =
        document
        .getElementById("uploadStatus");

    const button =
        document
        .getElementById("uploadButton");


    if(!file){

        status.textContent =
            "ابتدا یک تصویر انتخاب کنید.";

        return;
    }


    const industry =
        currentIndustry();


    if(!industry){

        status.textContent =
            "صنعت انتخاب نشده است.";

        return;
    }


    /* فرمت */

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif"
    ];


    if(!allowedTypes.includes(file.type)){

        status.textContent =
            "❌ فرمت تصویر مجاز نیست.";

        return;
    }


    /* حجم */

    if(file.size > 10 * 1024 * 1024){

        status.textContent =
            "❌ حجم تصویر بیشتر از 10MB است.";

        return;
    }


    /* جلوگیری از چند کلیک */

    button.disabled =
        true;

    button.textContent =
        "در حال آپلود...";


    try{


        /* ==============================
           تعیین پسوند
        ============================== */

        let extension =
            "jpg";


        if(file.type === "image/png"){

            extension =
                "png";

        }else if(
            file.type === "image/webp"
        ){

            extension =
                "webp";

        }else if(
            file.type === "image/gif"
        ){

            extension =
                "gif";

        }


        /* ==============================
           نام یکتا
        ============================== */

        const fileName =
            "image-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2,8) +
            "." +
            extension;


        /* ==============================
           مسیر نهایی
        ============================== */

        const filePath =
            industry +
            "/" +
            fileName;


        status.textContent =
            "در حال آپلود تصویر به Storage...";


        /* ==============================
           UPLOAD
        ============================== */

        const {
            error:uploadError
        } =
            await supabaseClient
            .storage
            .from("project-media")
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:file.type
                }
            );


        if(uploadError){

            throw new Error(
                "خطا در Storage: " +
                uploadError.message
            );

        }


        status.textContent =
            "تصویر آپلود شد. در حال ثبت اطلاعات...";


        /* ==============================
           ثبت دیتابیس
        ============================== */

        const {
            error:dbError
        } =
            await supabaseClient
            .from("industry_media")
            .insert({

                industry:industry,

                media_type:"image",

                file_path:filePath

            });


        if(dbError){

            /* حذف فایل در صورت خطای دیتابیس */

            await supabaseClient
            .storage
            .from("project-media")
            .remove([
                filePath
            ]);


            throw new Error(
                "خطا در ثبت دیتابیس: " +
                dbError.message
            );

        }


        /* ==============================
           URL
        ============================== */

        const publicUrl =
            supabaseClient
            .storage
            .from("project-media")
            .getPublicUrl(
                filePath
            )
            .data
            .publicUrl;


        console.log(
            "IMAGE PATH:",
            filePath
        );


        console.log(
            "IMAGE URL:",
            publicUrl
        );


        /* ==============================
           موفقیت
        ============================== */

        status.innerHTML =
            "✅ تصویر با موفقیت آپلود شد.";


        document
        .getElementById("imageFile")
        .value = "";


        document
        .getElementById("imagePreview")
        .style.display =
            "none";


        document
        .getElementById("fileInfo")
        .textContent =
            "تصویر با موفقیت ثبت شد.";


        await loadGallery();


    }catch(error){

        console.error(
            "IMAGE ERROR:",
            error
        );


        status.textContent =
            "❌ " +
            error.message;

    }


    button.disabled =
        false;

    button.textContent =
        "آپلود تصویر";

}


/* =====================================================
   LOAD GALLERY
===================================================== */

async function loadGallery(){

    const industry =
        currentIndustry();

    const gallery =
        document.getElementById("gallery");


    gallery.innerHTML =
        "در حال دریافت تصاویر...";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("industry_media")
        .select("*")
        .eq("industry",industry)
        .eq("media_type","image")
        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        gallery.innerHTML =
            "❌ خطا: " +
            escapeHtml(error.message);

        return;
    }


    if(!data || data.length === 0){

        gallery.innerHTML =
            "<p>هنوز تصویری ثبت نشده است.</p>";

        return;
    }


    gallery.innerHTML =
        "";


    data.forEach(function(item){

        const card =
            document.createElement("div");

        card.className =
            "media-card";


        if(!item.file_path){

            card.innerHTML = `

                <div class="media-info">
                    ❌ مسیر تصویر خالی است.
                </div>

                <button
                    class="danger"
                    onclick="deleteImage(
                        ${item.id},
                        ''
                    )"
                >
                    حذف رکورد
                </button>

            `;


            gallery.appendChild(card);

            return;
        }


        const imageUrl =
            supabaseClient
            .storage
            .from("project-media")
            .getPublicUrl(
                item.file_path
            )
            .data
            .publicUrl;


        card.innerHTML = `

            <img
                src="${escapeAttribute(imageUrl)}"
                alt="تصویر صنعت"
                loading="lazy"
            >

            <div class="media-info">
                ${escapeHtml(item.file_path)}
            </div>

            <button
                class="danger"
                onclick="deleteImage(
                    ${item.id},
                    '${escapeAttribute(item.file_path)}'
                )"
            >
                حذف تصویر
            </button>

        `;


        gallery.appendChild(card);


        const img =
            card.querySelector("img");


        img.addEventListener(
            "error",
            function(){

                img.style.display =
                    "none";


                const errorText =
                    document.createElement("div");


                errorText.className =
                    "media-info";


                errorText.style.color =
                    "#ef4444";


                errorText.textContent =
                    "❌ فایل در Storage قابل نمایش نیست.";


                card.insertBefore(
                    errorText,
                    card.firstChild
                );

            }
        );

    });

}


/* =====================================================
   DELETE IMAGE
===================================================== */

async function deleteImage(
    id,
    path
){

    if(!confirm(
        "این تصویر حذف شود؟"
    )){

        return;
    }


    if(path){

        const {
            error:storageError
        } =
            await supabaseClient
            .storage
            .from("project-media")
            .remove([
                path
            ]);


        if(storageError){

            alert(
                "خطا در حذف فایل: " +
                storageError.message
            );

            return;
        }

    }


    const {
        error
    } =
        await supabaseClient
        .from("industry_media")
        .delete()
        .eq("id",id);


    if(error){

        alert(
            "خطا در حذف رکورد: " +
            error.message
        );

        return;
    }


    await loadGallery();

}


/* =====================================================
   SAVE VIDEO
===================================================== */

async function saveVideo(){

    const industry =
        currentIndustry();

    const title =
        document
        .getElementById("videoTitle")
        .value
        .trim();

    const url =
        document
        .getElementById("videoUrl")
        .value
        .trim();

    const description =
        document
        .getElementById("videoDescription")
        .value
        .trim();


    if(!url){

        alert(
            "لینک ویدئو را وارد کنید."
        );

        return;
    }


    const {
        error
    } =
        await supabaseClient
        .from("industry_content")
        .insert({

            industry:industry,

            content_type:"video",

            title:title,

            content:description,

            subtitle:url,

            sort_order:0,

            is_visible:true

        });


    if(error){

        alert(
            "خطا در ذخیره ویدئو:\n" +
            error.message
        );

        return;
    }


    alert(
        "ویدئو اضافه شد."
    );


    document
    .getElementById("videoTitle")
    .value =
        "";

    document
    .getElementById("videoUrl")
    .value =
        "";

    document
    .getElementById("videoDescription")
    .value =
        "";


    await loadVideos();

}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

    const industry =
        currentIndustry();

    const list =
        document.getElementById("videoList");


    list.innerHTML =
        "در حال دریافت ویدئوها...";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("industry_content")
        .select("*")
        .eq("industry",industry)
        .eq("content_type","video")
        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML =
            "خطا: " +
            escapeHtml(error.message);

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML =
            "<p>هنوز ویدئویی ثبت نشده است.</p>";

        return;
    }


    list.innerHTML =
        "";


    data.forEach(function(item){

        const div =
            document.createElement("div");

        div.className =
            "content-item";


        div.innerHTML = `

            <h3>
                ${escapeHtml(
                    item.title || "ویدئو"
                )}
            </h3>

            <p>
                ${escapeHtml(
                    item.content || ""
                )}
            </p>

            <a
                href="${escapeAttribute(
                    item.subtitle || ""
                )}"
                target="_blank"
                rel="noopener"
                style="color:#38bdf8"
            >
                مشاهده ویدئو
            </a>

            <br>

            <button
                class="danger"
                onclick="deleteContent(${item.id})"
            >
                حذف
            </button>

        `;


        list.appendChild(div);

    });

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHtml(value);

}


/* =====================================================
   START
===================================================== */

checkSession();

</script>
