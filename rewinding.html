<script>

const IMAGE_URL =
"https://eurmybgotfgnerdxrwua.supabase.co/storage/v1/object/public/project-media/rewinding/1787393789750-ox1w9a.jpg";

document.addEventListener("DOMContentLoaded", function(){

    const gallery = document.getElementById("galleryBox");

    gallery.innerHTML = "";

    const card = document.createElement("div");

    card.className = "gallery-card";

    const img = document.createElement("img");

    img.src = IMAGE_URL;

    img.alt = "تصویر صنعت سیم‌پیچی";

    img.style.width = "100%";

    img.style.height = "400px";

    img.style.objectFit = "contain";

    img.style.background = "#000";

    img.style.display = "block";

    img.onload = function(){

        console.log("IMAGE LOADED");

    };

    img.onerror = function(){

        console.log("IMAGE ERROR");

        gallery.innerHTML = `
            <div class="error">
                عکس از Supabase قابل دریافت نیست.
                <br><br>
                احتمالاً دسترسی عمومی Bucket یا مسیر فایل مشکل دارد.
            </div>
        `;

    };

    card.appendChild(img);

    gallery.appendChild(card);

});

</script>
