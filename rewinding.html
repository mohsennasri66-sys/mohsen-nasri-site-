<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تست تصویر سیم‌پیچی | Mohsen Nasri</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#061019;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    padding:20px;
    background:#020911;
    text-align:center;
}

h1{
    margin:0;
    color:#38bdf8;
}

.test{
    padding:50px 7%;
    text-align:center;
}

.test img{
    display:block;
    width:100%;
    max-width:1100px;
    height:auto;
    margin:30px auto;

    border:3px solid #38bdf8;
    border-radius:15px;
}

.success{
    color:#22c55e;
    font-size:20px;
}

.error{
    color:#ef4444;
    font-size:20px;
}

</style>

</head>

<body>

<header>

<h1>
تست تصویر سیم‌پیچی
</h1>

</header>

<section class="test">

<h2>
تصویر جدید
</h2>

<img
    src="./rewinding-test.jpg"
    alt="Rewinding Test"
    onload="document.getElementById('status').innerHTML='✅ تصویر با موفقیت نمایش داده شد';"
    onerror="document.getElementById('status').innerHTML='❌ تصویر پیدا نشد';"
>

<div id="status">
در حال بررسی تصویر...
</div>

</section>

</body>

</html>
