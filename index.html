.hero{
    position:relative;
    width:100%;
    min-height:100vh;
    height:100vh;
    padding-top:75px;
    display:flex;
    align-items:center;
    overflow:hidden;

    background:
    linear-gradient(
        90deg,
        rgba(0,0,0,.20),
        rgba(0,0,0,.05)
    ),
    url("industrial-hero.png") center center / cover no-repeat;

    background-color:#030b14;
}
