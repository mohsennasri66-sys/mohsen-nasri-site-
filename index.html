<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mohsen Nasri | Industrial Engineering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            color: white;
            overflow-x: hidden;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.30)
                ),
                url("industrial-hero.png");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .page {
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.08);
        }

        /* ========================================
           HEADER
        ======================================== */

        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;

            height: 95px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 4%;

            background: rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(8px);

            border-bottom: 1px solid rgba(255,255,255,0.15);

            z-index: 1000;
        }

        /* لوگو سمت راست */

        .logo-link {
            display: flex;
            align-items: center;

            text-decoration: none;
        }

        .logo-image {
            width: 80px;
            height: 80px;

            object-fit: contain;

            border-radius: 50%;

            display: block;

            filter:
                drop-shadow(
                    0 4px 12px rgba(0,0,0,0.7)
                );

            transition:
                transform 0.3s ease;
        }

        .logo-image:hover {
            transform: scale(1.06);
        }

        /* ========================================
           NAVIGATION
        ======================================== */

        nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav a {
            color: #ffffff;

            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            transition:
                color 0.3s ease,
                transform 0.3s ease;
        }

        nav a:hover {
            color: #39bdf8;
            transform: translateY(-2px);
        }

        /* ========================================
           HERO
        ======================================== */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding:
                120px
                20px
                70px;
        }

        .hero-content {
            width: 100%;
            max-width: 950px;

            margin: auto;
        }

        .hero h1 {
            font-size:
                clamp(45px, 8vw, 90px);

            line-height: 1.1;

            margin-bottom: 25px;

            font-weight: 800;

            text-shadow:
                0 5px 25px rgba(0,0,0,0.9);
        }

        .hero h1 span {
            color: #39bdf8;
        }

        .hero p {
            font-size:
                clamp(17px, 2.5vw, 24px);

            line-height: 2;

            margin-bottom: 38px;

            color: #f0f5f8;

            text-shadow:
                0 3px 15px rgba(0,0,0,0.95);
        }

        /* ========================================
           BUTTONS
        ======================================== */

        .buttons {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 170px;

            padding:
                14px
                30px;

            color: #ffffff;

            text-decoration: none;

            border-radius: 8px;

            background:
